<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenreAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="/">
            <i id="note-icon" class="fa-solid fa-music"></i>
        </a>
        <nav>
            <a href="#about">About</a>
            <a href="#login">Login</a>
        </nav>
    </header>
    <main class="main">
        <a href="/" class="name-and-logo">
            <img src="images/GenreAI logo.png" alt="Logo GenreAI">
            <h1 class="app-name">GenreAI</h1>
        </a>

        <div class="main-area">
            <label for="input-file" id="drop-area">
                <input type="file" accept="audio/*" id="input-file" name="file" hidden>
                <i class="fa-solid fa-folder fa-2x" id="folder-icon"></i>
                <p>Drag and drop or click here<br>to upload audio file</p>
                <span>Upload any audio files from desktop</span>
            </label>
            <div id="loader-animation" class="loader" style="display: none;"></div>
        </div>
        
        <div id="result" class="main-area" style="display: none;"></div>
    </main>
</body>
</html>
